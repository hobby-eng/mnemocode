[package]
name = "aud010-fix-verification"
version = "0.0.0"
edition = "2024"
publish = false
autobins = false

[workspace]

[[bin]]
name = "validate"
path = "src/bin/validate.rs"

[dependencies]
mnemocode = { path = "../../../crates/mnemocode" }
mnemocode-cards = { path = "../../../crates/mnemocode-cards" }
mnemocode-embroidery = { path = "../../../crates/mnemocode-embroidery", features = ["sskr"] }
serde = "1"
serde_json = "1"
regex = "1"

[dev-dependencies]
portable-pty = "=0.9.0"
libc = "=0.2.191"

[lints]
workspace = true

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"

[patch.crates-io]
bc-crypto = { path = "../../../shims/bc-crypto" }

[profile.dev.package."*"]
opt-level = 3
