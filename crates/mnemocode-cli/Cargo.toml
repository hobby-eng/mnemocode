[package]
name = "mnemocode-cli"
description = "The mnemocode command line and start menu."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "mnemocode"
path = "src/main.rs"
# A program, not a library: no API documentation (its name is also the library's).
doc = false

[dependencies]
mnemocode = { workspace = true, features = [
  "sskr",
  "search-date",
  "search-word",
  "search-marked-codes",
  "coin-bitcoin",
  "coin-bitcoin-cash",
  "coin-cosmos",
  "coin-dash",
  "coin-dogecoin",
  "coin-ethereum",
  "coin-ethereum-classic",
  "coin-injective",
  "coin-litecoin",
  "coin-tron",
  "coin-xrp",
  "coin-zcash",
] }
mnemocode-cards = { workspace = true, features = [
  "sskr",
  "template-business-architect",
  "template-business-it",
  "template-business-estate",
  "template-business-diagonal",
  "template-business-contact",
  "template-business-curves",
  "template-business-facets",
  "template-business-mixed",
  "template-material-vehicle",
  "template-material-enclosure",
  "template-material-tile",
  "template-material-switch",
  "template-material-kitchen",
] }
mnemocode-embroidery.workspace = true
getrandom.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_ErrorReporting",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
] }

[dev-dependencies]
serde_json.workspace = true
portable-pty.workspace = true

[lints]
workspace = true
