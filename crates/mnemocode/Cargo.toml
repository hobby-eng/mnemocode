[package]
name = "mnemocode"
description = "Every rule of MnemoCode: BIP39 phrases, encoded backups, shares, searches and wallet checks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Each unit (a coin, a share form, a search) gets its feature with the increment that builds it
# (docs/design/architect/ARCHITECTURE.md §8, §9).
[features]
default = []

[dependencies]
bip39.workspace = true
bs58.workspace = true
hmac.workspace = true
k256.workspace = true
ripemd.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_Memory",
  "Win32_System_SystemInformation",
] }

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
