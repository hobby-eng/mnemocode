[package]
name = "mnemocode-wasm"
description = "MnemoCode's WebAssembly binding: one class per operation, built once per page profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# One `browser-*` feature per binding module, each added with its library part
# (docs/design/architect/ARCHITECTURE.md §9; wasm-profiles.json names them per page).
[features]
default = []
# The memory scan's own entries, built only into the test profile test/probe, never a page's file.
browser-probe = []

[dependencies]
mnemocode.workspace = true

[dependencies.wasm-bindgen]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's randomness (crypto.getRandomValues) for the library's Random port.
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true
