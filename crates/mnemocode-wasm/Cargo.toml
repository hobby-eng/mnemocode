[package]
name = "mnemocode-wasm"
description = "MnemoCode's WebAssembly binding: one class per operation, built once per page profile."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# One `browser-*` feature per binding module, each added with its library part
# (docs/design/architect/ARCHITECTURE.md §9; wasm-profiles.json names them per page).
[features]
default = []
# The memory scan's own entries, built only into the test profile test/probe, never a page's file.
browser-probe = [
  "browser-phrase",
  "browser-wallet",
  "browser-qr",
  "browser-candidates",
  "browser-sskr",
  "browser-recovery",
  "browser-cards",
  "template-material-tile",
  "coin-bitcoin",
]
# One module per library part (ARCHITECTURE.md §9); a page's profile names those it uses.
browser-phrase = []
browser-wallet = []
browser-qr = []
browser-candidates = []
browser-cards = ["dep:mnemocode-cards"]
# Shamir shares: the library's sskr, and the browser backend of its engine's randomness crate.
browser-sskr = ["mnemocode/sskr", "dep:getrandom03", "mnemocode-cards?/sskr"]
browser-recovery = [
  "browser-sskr",
  "mnemocode/search-date",
  "mnemocode/search-word",
  "mnemocode/search-marked-codes",
]
# The cards' units, which a page's profile names: each design with its artwork.
template-business-architect = ["mnemocode-cards?/template-business-architect"]
template-business-it = ["mnemocode-cards?/template-business-it"]
template-business-estate = ["mnemocode-cards?/template-business-estate"]
template-business-diagonal = ["mnemocode-cards?/template-business-diagonal"]
template-business-contact = ["mnemocode-cards?/template-business-contact"]
template-business-curves = ["mnemocode-cards?/template-business-curves"]
template-business-facets = ["mnemocode-cards?/template-business-facets"]
template-business-mixed = ["mnemocode-cards?/template-business-mixed"]
template-material-vehicle = ["mnemocode-cards?/template-material-vehicle"]
template-material-enclosure = ["mnemocode-cards?/template-material-enclosure"]
template-material-tile = ["mnemocode-cards?/template-material-tile"]
template-material-switch = ["mnemocode-cards?/template-material-switch"]
template-material-kitchen = ["mnemocode-cards?/template-material-kitchen"]
# The library's units, which a page's profile names: each coin of the wallet module.
coin-bitcoin = ["mnemocode/coin-bitcoin"]
coin-bitcoin-cash = ["mnemocode/coin-bitcoin-cash"]
coin-cosmos = ["mnemocode/coin-cosmos"]
coin-dash = ["mnemocode/coin-dash"]
coin-dogecoin = ["mnemocode/coin-dogecoin"]
coin-ethereum = ["mnemocode/coin-ethereum"]
coin-ethereum-classic = ["mnemocode/coin-ethereum-classic"]
coin-injective = ["mnemocode/coin-injective"]
coin-litecoin = ["mnemocode/coin-litecoin"]
coin-tron = ["mnemocode/coin-tron"]
coin-xrp = ["mnemocode/coin-xrp"]
coin-zcash = ["mnemocode/coin-zcash"]

[dependencies]
mnemocode.workspace = true
mnemocode-cards = { workspace = true, optional = true }
# The randomness of the library's Random port: the browser's (crypto.getRandomValues) in the
# WebAssembly, the system's in the native builds of the gates.
getrandom.workspace = true

[dependencies.wasm-bindgen]
workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }
# bc-rand, under the vendored engine, takes getrandom 0.3, which has no browser backend unless asked
# for one; nothing here calls it (the engine's generator is seeded from the Random port).
getrandom03 = { package = "getrandom", version = "=0.3.4", features = ["wasm_js"], optional = true }

[lints]
workspace = true
