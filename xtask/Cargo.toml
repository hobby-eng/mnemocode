[package]
name = "xtask"
description = "The repository's gates, checks and builds, as `cargo xtask <task>` (TOOL-01)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"
# A tool of the repository, not a library: no API documentation.
doc = false

[dependencies]
proc-macro2 = { version = "=1.0.107", default-features = false, features = ["span-locations"] }
serde_json.workspace = true
sha2.workspace = true
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate"] }
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing", "visit"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Wdk_Foundation",
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
] }

[lints]
workspace = true
