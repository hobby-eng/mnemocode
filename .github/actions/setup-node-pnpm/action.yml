# pnpm, then Node.js from .node-version with the pnpm cache, then the locked install: what every job
# that runs pnpm takes after its checkout. Checkout stays in each job, since a local action can be
# found only once the repository is checked out. scripts/verify-toolchain.mjs checks that every job
# takes this action instead of setting up Node.js or pnpm itself.
name: Set up Node.js and pnpm
description: pnpm from package.json, Node.js from .node-version, and the locked install
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
