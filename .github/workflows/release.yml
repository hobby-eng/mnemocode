name: Release

on:
  push:
    tags:
      - "v*"
  # The same builds and checks on any commit, without a draft (CI-04).
  workflow_dispatch:

# One release run per tag at a time, never cancelled half-way: a second push of the same tag waits.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Linux x86-64 and ARM64, Windows x86-64 and every page's WebAssembly file, byte for byte
  # reproducible.
  canonical:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Verify the tag and its release notes
        if: github.event_name == 'push'
        run: |
          test "$GITHUB_REF_NAME" = "v$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "mnemocode-cli"))')"
          test -s "docs/releases/$GITHUB_REF_NAME.md"
      - name: Refuse a tag that has a release or draft already
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$tags" | grep -Fqx -- "$GITHUB_REF_NAME"; then
            echo "::error::$GITHUB_REF_NAME has a release or draft already; delete it first."
            exit 1
          fi
      - name: Audit Cargo.lock against RustSec
        uses: actions-rust-lang/audit@72c09e02f132669d52284a3323acdb503cfc1a24 # v1.2.7
        with:
          createIssues: false
      - name: Build the release files in the canonical container
        run: |
          docker buildx build --platform linux/amd64 --target artifacts \
            --output type=local,dest=canonical-output -f packaging/Dockerfile.reproducible .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: canonical
          path: canonical-output/release/*
          if-no-files-found: error

  # The same files built again from no cache: a byte that differs stops the release.
  rebuild:
    needs: canonical
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: dist/release
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Compare a second build byte for byte
        run: cargo xtask reproducible

  # The slow gates: each feature alone, and every test with the ignored ones.
  slow:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the features gate
        run: cargo xtask features

  # Each executable run on its own system, away from the checkout.
  linux:
    needs: canonical
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            file: linux-x64
          - os: ubuntu-24.04-arm
            file: linux-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: canonical
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the executable on its own
        env:
          FILE: ${{ matrix.file }}
        run: |
          chmod +x canonical/mnemocode-*-"$FILE"
          cargo xtask verify-executable canonical/mnemocode-*-"$FILE"
      # W-DLL-SEARCH on the file that ships.
      - name: Check the imports of the Windows executable
        if: matrix.file == 'linux-x64'
        run: cargo xtask windows-imports canonical/mnemocode-*-win-x64.exe --check

  windows:
    needs: canonical
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: canonical
          path: canonical
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the executable on its own
        shell: bash
        run: cargo xtask verify-executable canonical/mnemocode-*-win-x64.exe

  # macOS needs Apple's SDK, so these two are built on macOS runners.
  macos:
    strategy:
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            file: macos-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            file: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Build the executable
        run: cargo xtask release build ${{ matrix.target }}
      - name: Run the executable on its own
        env:
          FILE: ${{ matrix.file }}
        run: cargo xtask verify-executable dist/release/mnemocode-*-"$FILE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error

  # Every check of CI on the tagged commit.
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    if: github.event_name == 'push'
    needs: [checks, canonical, rebuild, slow, linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # The workflow's OIDC identity gets a short-lived Sigstore signing certificate for the build
      # provenance, and GitHub stores the attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true
      # Every file must match the checksum written by the job that built it, and every file must
      # be covered: a file changed or added between the jobs stops the release here.
      - name: Check every file against its building job, then write SHA256SUMS
        run: |
          cd release
          cat -- *.sha256 > built.sha256sums
          sha256sum --check --strict built.sha256sums
          rm -- *.sha256
          diff <(cut -d' ' -f3 built.sha256sums | sort) <(ls | grep -v '^built.sha256sums$' | sort)
          mv built.sha256sums SHA256SUMS
          cat SHA256SUMS
      - name: Generate build-provenance attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "release/*"
      # The signing key stays on the maintainer's computer: cargo xtask sign, docs/RELEASING.md.
      - name: Prepare the verified release draft for OpenPGP signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --draft \
            --title "MnemoCode $GITHUB_REF_NAME" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md" \
            --verify-tag
