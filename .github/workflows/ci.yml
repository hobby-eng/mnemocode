name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless (CI-03).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast gates of CORE-43 (cargo xtask check), every one Rust (TOOL-01); the slow ones run at
  # release (CI-04).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install the pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install dprint, checked against its SHA-256
        env:
          DPRINT: "0.63.0"
          DPRINT_SHA256: f58b5d7c13ccd613cfa264f1ae82d4e5db1373f8fe20462bc1126051d111b0ce
        run: |
          archive="dprint-x86_64-unknown-linux-gnu.zip"
          curl --fail --silent --show-error --location --proto '=https' \
            --output "$RUNNER_TEMP/$archive" \
            "https://github.com/dprint/dprint/releases/download/$DPRINT/$archive"
          echo "$DPRINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/dprint"
          echo "$RUNNER_TEMP/dprint" >> "$GITHUB_PATH"
      - name: Run the fast gates
        run: cargo xtask check

  # The fast tests on Windows and macOS, whose own code compiles only there.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        run: cargo test --locked --workspace

  # W-DLL-SEARCH: each DLL the executable relies on is a KnownDLL of every Windows runner.
  knowndlls:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Read the KnownDlls object directory
        run: cargo xtask knowndlls

  # W-DLL-SEARCH: the Windows executable, built as a release builds it (x86_64-pc-windows-gnu with
  # MinGW-w64), imports only those KnownDLLs and API sets.
  windows-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and MinGW-w64
        run: |
          rustup show
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build the Windows executable and check its imports
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo build --locked --release -p mnemocode-cli --target x86_64-pc-windows-gnu
          cargo xtask windows-imports target/x86_64-pc-windows-gnu/release/mnemocode.exe --check
