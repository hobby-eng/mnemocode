name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch or pull request makes a running check pointless (CI-03).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast gates of CORE-43 (scripts/check.sh); the slow ones run at release (CI-04).
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Install the tooling package
        run: pnpm install --frozen-lockfile
      - name: Install the pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Run the fast gates
        run: scripts/check.sh

  # The fast tests on Windows and macOS, whose own code compiles only there.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Run the fast tests
        run: cargo test --locked --workspace

  # W-DLL-SEARCH: each DLL the executable relies on is a KnownDLL of every Windows runner.
  knowndlls:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the KnownDlls object directory
        shell: pwsh
        run: scripts/read-knowndlls.ps1

  # W-DLL-SEARCH: the Windows executable, built as a release builds it (x86_64-pc-windows-gnu with
  # MinGW-w64), imports only those KnownDLLs and API sets.
  windows-imports:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain and MinGW-w64
        run: |
          rustup show
          rustup target add x86_64-pc-windows-gnu
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-mingw-w64-x86-64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Build the Windows executable and check its imports
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          cargo build --locked --release -p mnemocode-cli --target x86_64-pc-windows-gnu
          node scripts/verify-windows-imports.mjs \
            target/x86_64-pc-windows-gnu/release/mnemocode.exe scripts/knowndlls.json
