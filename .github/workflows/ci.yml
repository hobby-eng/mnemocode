name: CI

on:
  # A tag gets this check through the executable workflow, not a second time here.
  push:
    branches: ["**"]
  pull_request:
  # The executable workflow runs this whole check before it publishes a release.
  workflow_call:

permissions:
  contents: read

# A newer push makes a running check pointless. When the executable workflow calls this one,
# github.workflow is the caller's name, so the two never share a group; a tag run is not cut off.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm format:check
      # Poppler before the tests: without it the card tests that rasterize PDFs are skipped.
      - run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends poppler-utils
      - run: pnpm build
      - run: pnpm test
      - name: Drive the menu and the hidden prompts in a Unix pseudo-terminal
        timeout-minutes: 10
        run: python3 scripts/verify-terminal-input.py
      # A real PDF-to-image-to-QR round trip of the card and SSKR exports, with public data only.
      - run: node scripts/check-card-output.mjs output/card-output-check
      - run: pnpm audit --audit-level high

  # The command line and the library on Windows and macOS. Poppler is not installed here, so the card
  # tests that rasterize PDFs are skipped; the Linux job runs them.
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Drive the menu and the hidden prompts in a Unix pseudo-terminal
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: python3 scripts/verify-terminal-input.py
      - name: Drive the menu and the hidden prompts in a Windows pseudo-console
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: |
          # Only the exact files listed with their SHA-256 in the requirements file are accepted.
          python -m pip install --require-hashes -r scripts/verify-terminal-input-requirements.txt
          python scripts/verify-terminal-input.py
