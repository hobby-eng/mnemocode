name: Executable

# Builds MnemoCode as one executable file on Linux, Windows and macOS: a Node.js single executable
# is made from the Node.js binary of the system that builds it, so each system builds its own
# (scripts/build-executable.mjs). Each one is run on its own system from an empty folder
# (scripts/verify-executable.mjs). A tag v<version> publishes the three files, the license notices
# written next to each of them and SHA256SUMS as a GitHub release.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executable-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release needs the complete CI on the tagged commit, not only the smoke checks of the
  # executable: types, format, tests, the PDF/QR round trip and the dependency audit.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: The tag names the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          # The release text comes from curated notes; a tag without them stops here.
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "Missing release notes: docs/releases/$GITHUB_REF_NAME.md" >&2
            exit 1
          }
      - run: node scripts/build-executable.mjs
      - name: Run the executable on its own system
        run: node scripts/verify-executable.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: executable-${{ matrix.os }}
          path: |
            release/mnemocode-*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Only for the release notes in docs/releases; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: executable-*
          path: release
          merge-multiple: true
      - name: Publish the executables with SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          cat *.sha256 | sort -k 2 > SHA256SUMS
          rm *.sha256
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --title "MnemoCode ${GITHUB_REF_NAME#v}" \
            --notes-file "$GITHUB_WORKSPACE/docs/releases/$GITHUB_REF_NAME.md" \
            mnemocode-* SHA256SUMS
