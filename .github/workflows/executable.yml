name: Executable

# Builds MnemoCode as one executable file on Linux, Windows and macOS: a Node.js single executable
# is made from the Node.js binary of the system that builds it, so each system builds its own
# (scripts/build-executable.mjs). Each one is run on its own system from an empty folder
# (scripts/verify-executable.mjs). A tag v<version> puts the three files, the license notices
# written next to each of them and SHA256SUMS in a draft GitHub release, which the owner signs and
# publishes (docs/RELEASING.md).

# Three builds on three systems are no fast check (CI-04): a release tag and manual dispatch only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: executable-${{ github.ref }}
  # A newer push makes a running build pointless; a tag run creates the release draft and is never
  # cut off halfway.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # A release needs the complete CI on the tagged commit, not only the smoke checks of the
  # executable: types, format, tests, the PDF/QR round trip and the dependency audit.
  verify:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  # The SSKR engine is built again from sskr-wasm/rust in its pinned container and must equal the
  # committed WASM byte for byte. The build takes minutes, so only a release runs it.
  sskr:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm verify:sskr

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-pnpm
      - name: The tag names the version in package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
          # The release text comes from curated notes; a tag without them stops here.
          test -s "docs/releases/$GITHUB_REF_NAME.md" || {
            echo "Missing release notes: docs/releases/$GITHUB_REF_NAME.md" >&2
            exit 1
          }
      - run: node scripts/build-executable.mjs
      - name: Run the executable on its own system
        run: node scripts/verify-executable.mjs
      # A double-click starts the executable without arguments: its menu and hidden prompts.
      - name: Find the executable
        id: executable
        shell: bash
        run: |
          echo "path=$(node scripts/verify-executable.mjs --print-path)" >> "$GITHUB_OUTPUT"
      - name: Drive the menu of the executable in a pseudo-terminal
        timeout-minutes: 10
        uses: ./.github/actions/terminal-input
        with:
          target: ${{ steps.executable.outputs.path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executable-${{ matrix.os }}
          path: |
            release/mnemocode-*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [verify, sskr, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      # For the build provenance (actions/attest): the workflow's OIDC identity gets a short-lived
      # Sigstore signing certificate, and GitHub stores the attestation. artifact-metadata is not
      # needed: a storage record exists only for images pushed to a registry (push-to-registry).
      id-token: write
      attestations: write
    steps:
      # GitHub does not tie a draft to its tag, so running this job again would add a second draft
      # with other builds beside the first. A broken draft is deleted on GitHub before a re-run.
      - name: Refuse a tag that has a release or draft already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tags=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if printf '%s\n' "$tags" | grep -Fqx -- "$GITHUB_REF_NAME"; then
            echo "::error::$GITHUB_REF_NAME has a release or draft already; delete it first."
            exit 1
          fi
      # Only for the release notes in docs/releases; nothing is built here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: executable-*
          path: release
          merge-multiple: true
      - name: Write SHA256SUMS
        working-directory: release
        run: |
          cat *.sha256 | sort -k 2 > SHA256SUMS
          rm *.sha256
          sha256sum --check SHA256SUMS
      # GitHub signs that each file in SHA256SUMS was built by this workflow from this repository,
      # before the release exists; gh attestation verify checks a download (README).
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS
      # Only a draft: the OpenPGP key stays on the owner's computer. scripts/sign-release.mjs checks
      # the draft, signs SHA256SUMS and uploads the signature; then the owner publishes the draft,
      # on GitHub or with the script's --publish (docs/RELEASING.md).
      - name: Create the release draft for OpenPGP signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd release
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "MnemoCode ${GITHUB_REF_NAME#v}" \
            --notes-file "$GITHUB_WORKSPACE/docs/releases/$GITHUB_REF_NAME.md" \
            mnemocode-* SHA256SUMS
