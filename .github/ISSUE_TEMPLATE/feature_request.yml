name: Feature request
description: Propose a MnemoCode improvement without including private wallet data.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the recovery or interoperability problem, not a real wallet. Never include a mnemonic, passphrase, private key, WIF, SSKR share, recovery date, or private export.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what cannot be done safely or clearly today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the command, library API, format, validation, or documentation change you expect.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: security
    attributes:
      label: Security and privacy impact
      description: Note any effect on secret input, output files, QR/PDF export, SSKR, dependencies, network access, or compatibility.
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues for the same request.
          required: true
        - label: This request contains no real wallet secret or private recovery material.
          required: true
