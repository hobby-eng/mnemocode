[workspace]
members = [
  "crates/mnemocode",
  "crates/mnemocode-cards",
  "crates/mnemocode-cli",
  "crates/mnemocode-wasm",
  "shims/bc-crypto",
  "vendor/sskr-0.12.0",
  "vendor/bc-shamir-0.13.0",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hobby-eng/mnemocode"
publish = false

# RUST-01's table, plus the lints the gates name (docs/design/architect/GATES.md, `clippy`).
# unsafe_code is "deny": only mnemocode's secret::{pages, allocator} and the CLI's os modules allow
# it (RUST-07); mnemocode-cards, mnemocode-wasm and the bc-crypto stand-in forbid it in their roots.
[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
too_many_lines = "deny"
mod_module_files = "deny"
undocumented_unsafe_blocks = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "deny"
# The CLI writes through explicit writers on its descriptors (ARCHITECTURE.md §6).
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"

# Every runtime crate of the crates report, pinned exactly (CORE-25); a member names the ones it
# uses with `workspace = true`.
[workspace.dependencies]
mnemocode = { path = "crates/mnemocode", default-features = false }
mnemocode-cards = { path = "crates/mnemocode-cards", default-features = false }
# Text
unicode-normalization = "=0.1.26"
unicode-properties = { version = "=0.1.4", default-features = false, features = [
  "general-category",
] }
unicode-script = "=0.5.8"
# BIP39: words, lists, checksum, entropy and seed (owner, 2026-10-27: no own BIP39 code)
bip39 = { version = "=3.0.0", default-features = false, features = [
  "zeroize",
  "chinese-traditional",
] }
# Hashes and MAC (one RustCrypto generation)
# The zeroize features of the hashes, MACs and ciphers wipe their states and keys when they are
# dropped (CORE-24).
sha2 = { version = "=0.11.1", default-features = false, features = ["zeroize"] }
hmac = { version = "=0.13.0", features = ["zeroize"] }
ripemd = { version = "=0.2.0", default-features = false }
sha3 = { version = "=0.12.0", default-features = false }
# Keys and addresses
k256 = { version = "=0.14.0", default-features = false, features = ["arithmetic"] }
bech32 = { version = "=0.12.0", default-features = false, features = ["alloc"] }
bs58 = { version = "=0.5.1", default-features = false, features = ["alloc"] }
# age v1, own format code over these
chacha20poly1305 = { version = "=0.11.0", default-features = false, features = ["zeroize"] }
hkdf = "=0.13.0"
x25519-dalek = { version = "=3.0.0", default-features = false, features = [
  "zeroize",
  "static_secrets",
] }
scrypt = { version = "=0.12.0", default-features = false }
base64ct = { version = "=1.8.3", default-features = false, features = ["alloc"] }
# The SSKR engine, vendored unchanged, and its seeded generator
sskr = { version = "=0.12.0", path = "vendor/sskr-0.12.0" }
bc-rand = "=0.5.0"
rand_chacha = "=0.9.0"
rand_core = "=0.9.5"
# QR and images
qrcodegen = "=1.8.0"
rqrr = { version = "=0.11.0", default-features = false }
png = "=0.18.1"
miniz_oxide = "=0.9.1"
jpeg-encoder = "=0.7.1"
zune-jpeg = "=0.5.15"
# Cards: PDF, fonts, raster, colour maths
pdf-writer = "=0.15.0"
skrifa = "=0.49.0"
subsetter = { version = "=0.2.6", default-features = false }
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
libm = "=0.2.16"
# Secrets
zeroize = { version = "=1.9.1", features = ["zeroize_derive"] }
# Host services
getrandom = "=0.4.3"
libc = "=0.2.191"
windows-sys = "=0.61.2"
wasm-bindgen = "=0.2.129"
# Tests only: the recorded TS answers are JSON (vectors/ts-0.1.0/).
serde_json = "=1.0.154"

# RUST-12, as mhfe.
[profile.release]
panic = "abort"
lto = true
codegen-units = 1
strip = true

# The cryptographic primitives run unoptimized at a fraction of their speed: scrypt at the candidate
# files' work factor 2^18 takes half a minute, a list of 16 MiB seconds. The debug builds of the tests
# and the self-test optimize the dependencies, never the workspace's own crates; overflow checks and
# debug assertions stay on.
[profile.dev.package."*"]
opt-level = 3

# The WebAssembly files: the release profile, built for size, as the TS SSKR engine was
# (sskr-wasm/rust/Cargo.toml).
[profile.wasm]
inherits = "release"
opt-level = "s"

# Option (d) of the crates report, decided by the owner on 2026-10-27: bc-shamir 0.13.0 takes three
# items from bc-crypto, whose crates.io defaults compile the C libsecp256k1; the stand-in gives those
# three over hmac, sha2 and zeroize, and every vendored file stays unchanged. The `code-rules` gate
# refuses a Cargo.lock that lists bc-crypto from a registry, since an unmatched patch only warns.
[patch.crates-io]
bc-crypto = { path = "shims/bc-crypto" }
